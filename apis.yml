aid: hometap
name: Hometap
description: >-
  Hometap is a Boston-based fintech founded in 2017 that offers homeowners a
  home equity investment (HEI) — an alternative to home equity loans and HELOCs.
  In exchange for a share of a home's future value, homeowners receive cash up
  front with no monthly payments, no interest, and no income or debt-to-income
  requirements, settling any time within a 10-year term via sale, refinance, or
  buyout. Homeowners manage their investment and track equity through the free
  Hometap Home Equity Dashboard. The company has helped more than 26,000
  homeowners and completed over $1 billion in investments, and is backed by
  investors including General Catalyst. Hometap does not publish a public
  developer API or developer portal; this profile captures its public web
  properties and identity for the API Evangelist network.
